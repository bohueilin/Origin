openapi: 3.1.0
x-origin-status: proposed-not-deployed
info:
  title: Origin verification-substrate API design
  version: 0.1.0-design
  description: >
    A non-hosted design artifact for a future deterministic verification API.
    Origin does not currently expose /v1/certify or /v1/verify as hosted Pages
    operations. The implemented public flow is a browser-only synthetic policy
    evaluation plus offline verification; it does not contact or execute the
    named agent, confirm a provider effect, grant deployment authority, or issue
    a regulatory certification. Any future hosted API requires a separate
    authority, tenancy, abuse-control, privacy, operations, and launch review.
paths: {}
components:
  schemas:
    ProposedAgentConfig:
      type: object
      description: Proposed configuration fields that a future artifact could bind.
      properties:
        model: { type: string }
        tools:
          type: array
          items: { type: string }
        context: { type: string }
        harness: { type: string }
    ProposedVerificationResult:
      type: object
      description: >
        Illustrative response shape only. A valid artifact would mean reproducible
        under its named verifier and inputs, never that an agent is safe or that a
        real-world effect occurred.
      properties:
        artifact_valid: { type: boolean }
        issuer_trusted: { type: boolean }
        execution_verified: { type: boolean }
        code: { type: integer, enum: [0, 3, 4] }
