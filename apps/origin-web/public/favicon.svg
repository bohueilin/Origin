<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Origin">
  <!-- Origin mark: an "O" with a gate bar through it. Replaces the unrelated
       purple lightning artwork with the established Origin blue (#2f5bea) and
       graphite (#14161a). Three shapes only, so it stays legible at 16x16.
       No embedded external resources. -->
  <rect width="32" height="32" rx="7" fill="#2f5bea"/>
  <circle cx="16" cy="16" r="7.6" fill="none" stroke="#ffffff" stroke-width="3.6"/>
  <rect x="14.2" y="5.6" width="3.6" height="20.8" rx="1.8" fill="#14161a"/>
</svg>
